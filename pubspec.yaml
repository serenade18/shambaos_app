name: shambaOS
description: "Intelligent Farming"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  http: ^1.2.0 
  flutter_svg: ^2.0.9
  intl_phone_field: ^3.2.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_intl_phone_field: ^0.0.7
  shared_preferences: ^2.5.5
  intl_phone_number_input: ^0.7.4
  biometric_signature: ^10.2.0
  local_auth: ^2.3.0 
  flutter_secure_storage: ^8.1.0
  intl: ^0.19.0
  sms_autofill: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Variations are rendered from images/appicons/src/logo.svg by images/appicons/src/render_icons.py.
flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  # Android: the round design for older launchers; adaptive layers (green behind the leaf)
  # for Android 8+, so each launcher's mask shape is filled; the monochrome leaf for themed icons.
  image_path_android: "images/appicons/icon_round.png"
  adaptive_icon_background: "#355442"
  adaptive_icon_foreground: "images/appicons/icon_foreground.png"
  adaptive_icon_monochrome: "images/appicons/icon_monochrome.png"
  # iOS rounds the corners itself, so it gets the full-bleed square, plus the iOS 18 dark and tinted looks.
  image_path_ios: "images/appicons/appstore.png"
  image_path_ios_dark_transparent: "images/appicons/icon_ios_dark.png"
  image_path_ios_tinted_grayscale: "images/appicons/icon_ios_tinted.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/logo.png
    - images/appicons/
    - images/appicons/playstore.png
    - images/appicons/appstore.png
    - images/auth/
    - images/auth/about-tech-farmer.jpg
    - images/auth/farm.png
    - images/auth/banana.png
    - images/auth/milk.png
    - images/auth/cow.jpg
    - images/auth/chicken.png
    - images/auth/mountains.jpg
    - images/auth/farming.jpg
    - images/auth/beans.jpg
    - images/auth/plain.jpg
    - images/assets/facebook.png
    - images/assets/google.png
    - images/assets/tik-tok.png
    - images/assets/icons/
    - images/assets/icons/comments.svg
    - images/assets/icons/live-chat.png
    - images/assets/icons/analysis.png
    - images/assets/icons/customer.png
    - images/assets/icons/payment.png
    - images/assets/icons/inventory.png
    - images/assets/icons/leaf.png
    - images/assets/icons/procurement.png
    - images/assets/icons/revenue.png
    - images/assets/icons/livestock.png
    - images/assets/icons/subscription.png
    - images/assets/icons/vet.png
    - images/assets/icons/weather.png
    - images/assets/icons/chicken.png
    - images/assets/icons/cow.png
    - images/assets/icons/fish.png
    - images/assets/icons/goat.png
    - images/assets/icons/rabbit.png
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Shamba Ledger type: Zilla Slab for figures and titles, Atkinson Hyperlegible
  # Next for reading text, Atkinson Hyperlegible Mono for codes. Bundled so they
  # work offline; licences in fonts/OFL-*.txt.
  fonts:
    - family: ZillaSlab
      fonts:
        - asset: fonts/ZillaSlab-Medium.ttf
          weight: 500
        - asset: fonts/ZillaSlab-SemiBold.ttf
          weight: 600
        - asset: fonts/ZillaSlab-Bold.ttf
          weight: 700
    - family: Atkinson
      fonts:
        - asset: fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: PhosphorRegular
      fonts:
        - asset: fonts/Phosphor-Regular.ttf
    - family: PhosphorBold
      fonts:
        - asset: fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/Phosphor-Fill.ttf
    - family: AtkinsonMono
      fonts:
        - asset: fonts/AtkinsonHyperlegibleMono-Regular.ttf
          weight: 400
        - asset: fonts/AtkinsonHyperlegibleMono-Medium.ttf
          weight: 500

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
