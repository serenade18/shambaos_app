name: shambaOS
description: "Intelligent Farming"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  http: ^1.2.0 
  flutter_svg: ^2.0.9
  intl_phone_field: ^3.2.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_intl_phone_field: ^0.0.7
  shared_preferences: ^2.5.5
  intl_phone_number_input: ^0.7.4
  biometric_signature: ^10.2.0
  local_auth: ^2.3.0 
  flutter_secure_storage: ^8.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/appicons/playstore.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "images/appicons/appstore.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/logo.png
    - images/appicons/
    - images/appicons/playstore.png
    - images/appicons/appstore.png
    - images/auth/about-tech-farmer.jpg
    - images/auth/farm.png
    - images/auth/banana.png
    - images/auth/milk.png
    - images/auth/cow.jpg
    - images/auth/chicken.png
    - images/auth/mountains.jpg
    - images/auth/farming.jpg
    - images/auth/beans.jpg
    - images/auth/plain.jpg
    - images/assets/facebook.png
    - images/assets/google.png
    - images/assets/tik-tok.png
    - images/assets/icons/
    - images/assets/icons/comments.svg
    - images/assets/icons/live-chat.png
    - images/assets/icons/analysis.png
    - images/assets/icons/customer.png
    - images/assets/icons/payment.png
    - images/assets/icons/inventory.png
    - images/assets/icons/leaf.png
    - images/assets/icons/procurement.png
    - images/assets/icons/revenue.png
    - images/assets/icons/livestock.png
    - images/assets/icons/subscription.png
    - images/assets/icons/vet.png
    - images/assets/icons/weather.png
    - images/assets/icons/chicken.png
    - images/assets/icons/cow.png
    - images/assets/icons/fish.png
    - images/assets/icons/goat.png
    - images/assets/icons/rabbit.png
