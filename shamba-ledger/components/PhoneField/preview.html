<!-- @dsCard group="Inputs" height=220 subtitle="The sign-in number, with +254 built in" -->
<div class="sl" style="padding:16px;min-height:100%">
<div style="display:flex;flex-direction:column;gap:20px;max-width:380px">
  <label class="sl-field">
    <span class="sl-field__label">Your phone number</span>
    <span class="sl-field__box"><span class="sl-field__prefix">KE +254</span><input class="sl-field__input" inputmode="tel" value="712 345 678" aria-describedby="h1"></span>
    <span class="sl-field__hint" id="h1">We will send a 6-digit code by SMS.</span>
  </label>
  <label class="sl-field sl-field--error">
    <span class="sl-field__label">Sign-in code</span>
    <span class="sl-field__box"><input class="sl-field__input" inputmode="numeric" value="508 41" aria-describedby="h2"></span>
    <span class="sl-field__hint" id="h2">That code is not correct. 3 tries left.</span>
  </label>
</div>
</div>
